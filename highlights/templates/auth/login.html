{% extends "base.html" %}
{% block title %}Login — Highlightly{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; margin-top: var(--spacing-xl);">
  <div class="glass-card">

    <h2 style="text-align: center; margin-bottom: var(--spacing-lg);">Welcome back</h2>

    {% if messages %}
    {% for m in messages %}
    <div class="alert alert-error" style="text-align: center;">{{ m }}</div>
    {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <div class="form-group">
        <input name="username" placeholder="Username" class="input-field" required>
      </div>

      <div class="form-group">
        <input name="password" type="password" placeholder="Password" class="input-field" required>
      </div>

      <button class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 1rem;">
        Login
      </button>
    </form>

    <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: var(--spacing-lg);">
      No account?
      <a href="/signup/" style="color: var(--accent-primary); font-weight: 500;">Sign up</a>
    </p>
  </div>
</div>
{% endblock %}
