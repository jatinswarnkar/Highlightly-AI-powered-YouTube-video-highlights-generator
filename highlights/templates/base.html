{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>{% block title %}Highlightly{% endblock %}</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">

  <!-- Custom Styles (Pure CSS) -->
  <link rel="stylesheet" href="{% static 'highlights/style.css' %}">

  <!-- Dotted Glow Background Script -->
  <script defer src="{% static 'highlights/dotted-glow.js' %}"></script>

  <!-- Alpine.js -->
  <script defer src="https://unpkg.com/alpinejs"></script>
</head>

<body>
  <div class="dotted-bg-container">
    <canvas id="dotted-glow-canvas"
      style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none;"></canvas>
    <div class="glow-orb"></div>

    <!-- NAVBAR -->
    <div class="container">
      <nav class="navbar">
        <a href="/" class="nav-brand">
          ⚡ Highlightly
        </a>

        <div class="nav-links">
          {% if user.is_authenticated %}
          <span class="text-secondary">Hi {{ user.username }}</span>
          <a href="/logout/" class="text-muted">Logout</a>
          {% else %}
          <a href="/login/" class="text-secondary">Login</a>
          <a href="/signup/" class="btn btn-primary">
            Get Started
          </a>
          {% endif %}
        </div>
      </nav>
    </div>

    <main class="main-content">
      {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      © 2026 Highlightly • Built for creators
    </footer>

  </div> <!-- Close dotted-bg-container -->
</body>

</html>
