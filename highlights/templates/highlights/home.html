<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Highlightly — AI Video Highlights</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Alpine.js -->
  <script defer src="https://unpkg.com/alpinejs"></script>
</head>

<body
  class="bg-gradient-to-r from-slate-900 via-gray-800 to-slate-900 min-h-screen flex items-center justify-center"
>

  <!-- CSRF TOKEN (REQUIRED FOR POST) -->
  <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

  <div
    class="w-full max-w-3xl p-8 rounded-3xl shadow-xl bg-white/10 backdrop-blur-lg border border-white/20 text-white"
    x-data="highlightApp()"
  >

    <!-- HEADER -->
    <h1 class="text-4xl font-bold text-center mb-4 tracking-wide">
      ⚡ Highlightly
    </h1>

    <p class="text-gray-300 text-center mb-8">
      Paste a YouTube link <b>or</b> upload a video — get viral-ready highlights.
    </p>

    <!-- YOUTUBE URL -->
    <div class="mb-4">
      <input
        type="text"
        x-model="url"
        placeholder="YouTube URL (optional)"
        class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-600
               focus:ring-2 focus:ring-indigo-400 outline-none
               text-white placeholder-gray-400"
      >
    </div>

    <!-- OR DIVIDER -->
    <div class="flex items-center my-4 text-gray-400">
      <div class="flex-1 h-px bg-slate-600"></div>
      <span class="px-3 text-sm">OR</span>
      <div class="flex-1 h-px bg-slate-600"></div>
    </div>

    <!-- FILE UPLOAD -->
    <div class="mb-6">
      <input
        type="file"
        accept="video/*"
        @change="file = $event.target.files[0]"
        class="w-full px-4 py-3 rounded-xl bg-slate-800
               border border-slate-600 text-white"
      >
      <p class="text-xs text-gray-400 mt-1">
        MP4, MOV, MKV — size depends on server plan
      </p>
    </div>

    <!-- SUBMIT -->
    <button
      @click="start()"
      :disabled="loading"
      class="w-full bg-indigo-600 hover:bg-indigo-500
             disabled:opacity-60 text-white py-3
             rounded-xl font-semibold transition"
    >
      🎬 Generate Highlights
    </button>

    <!-- LOADER -->
    <div class="mt-6 text-center" x-show="loading">
      <svg
        class="animate-spin h-12 w-12 mx-auto text-indigo-500"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
      >
        <circle class="opacity-25" cx="12" cy="12" r="10"
                stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
      </svg>
      <p class="text-gray-400 mt-2">
        Processing video… this may take a minute ⏳
      </p>
    </div>

    <!-- RESULTS -->
    <div
      class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-6"
      x-show="highlights.length > 0"
    >
      <template x-for="highlight in highlights" :key="highlight.video">
        <div class="bg-slate-800 rounded-xl overflow-hidden shadow-lg">

          <video class="w-full h-48 object-cover" controls preload="metadata">
            <source :src="highlight.video" type="video/mp4">
          </video>

          <div class="p-4 flex justify-between items-center">
            <span class="text-sm text-gray-200 truncate">
              AI Highlight
            </span>

            <a
              :href="highlight.video"
              download
              class="bg-emerald-500 hover:bg-emerald-400
                     px-4 py-2 rounded-xl
                     font-bold text-white text-sm"
            >
              ⬇ Download
            </a>
          </div>

        </div>
      </template>
    </div>

  </div>

  <!-- APP LOGIC -->
  <script>
    function getCSRFToken() {
      return document.querySelector(
        '[name=csrfmiddlewaretoken]'
      ).value;
    }

    function highlightApp() {
      return {
        url: "",
        file: null,
        loading: false,
        highlights: [],

        async start() {
          if (!this.url && !this.file) {
            alert("Please provide a YouTube link or upload a video.");
            return;
          }

          this.loading = true;
          this.highlights = [];

          const formData = new FormData();
          if (this.url) formData.append("url", this.url);
          if (this.file) formData.append("file", this.file);

          try {
            const response = await fetch("/start/", {
              method: "POST",
              headers: {
                "X-CSRFToken": getCSRFToken()
              },
              body: formData
            });

            const data = await response.json();

            if (!response.ok) {
              throw new Error(data.error || "Failed to process video");
            }

            this.highlights = data.highlights || [];

          } catch (err) {
            alert(err.message);
          } finally {
            this.loading = false;
          }
        }
      };
    }
  </script>

</body>
</html>
