{% extends 'base.html' %}

{% block title %}Checkout Canceled | Highlightly{% endblock %}

{% block content %}
<div class="container" style="padding: clamp(6rem, 15vh, 8rem) 0 var(--spacing-xxl); text-align: center;">
    <div
        style="max-width: 600px; margin: 0 auto; background: rgba(18, 18, 23, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 4rem 2rem;">

        <div
            style="width: 80px; height: 80px; background: rgba(239, 68, 68, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem auto;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--danger, #ef4444)" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </div>

        <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem; color: white;">Checkout Canceled</h1>

        <p style="color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 2rem;">
            Your payment process was canceled. No charges were made.
        </p>

        <div style="display: flex; gap: 1rem; justify-content: center;">
            <a href="/pricing/" class="btn btn-primary">Return to Pricing</a>
            <a href="/dashboard/" class="btn btn-outline">Go to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
